# Ошибки типа «сломанный lockfile прямо на main» ловятся здесь, а не постфактум.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm зафиксирована: check-pnpm.mjs требует pnpm 10.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Зависимости (строго по lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Юнит-тесты
        run: pnpm --filter ./artifacts/** --if-present run test

      - name: Сборка
        run: pnpm --filter ./artifacts/** --if-present run build
        env:
          BASE_PATH: /